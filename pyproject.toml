[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-runtime"
version = "0.1.0"
description = "SCOPE runtime"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [ { name = "mitchell-d00" } ]

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.packages.find]
where = ["."]
include = ["scope_runtime*", "scope_utils*"]

[project.optional-dependencies]
dev = ["pytest", "flake8", "mypy"]
